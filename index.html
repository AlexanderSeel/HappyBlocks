<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#061014" />
    <title>HappyBlocks</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" aria-label="HappyBlocks physics game"></canvas>
      <div id="hud" class="hud">
        <div class="hud__brand">HAPPY<span>BLOCKS</span></div>
        <div class="hud__stats">
          <div><small>LEVEL</small><strong id="level-name">Loading…</strong></div>
          <div><small id="resource-label">SHOTS</small><strong id="shots">0</strong></div>
          <div><small>COMBO</small><strong id="combo">—</strong></div>
          <div><small>SCORE</small><strong id="score">0</strong></div>
        </div>
        <div class="hud__level-select" aria-label="Prototype levels">
          <button type="button" data-level-url="/levels/level_001_first_collapse.json" data-active="true">01 · First Collapse</button>
          <button type="button" data-level-url="/levels/level_002_crossfire.json">02 · Crossfire</button>
          <button type="button" data-level-url="/levels/level_003_ricochet_lab.json">03 · Ricochet Lab</button>
          <button type="button" data-level-url="/levels/level_004_precision_pull.json">04 · Precision Pull</button>
          <button type="button" data-level-url="/levels/level_005_guardian.json">05 · Guardian</button>
          <button type="button" data-level-url="/levels/level_006_sky_citadel.json">06 · Sky Citadel</button>
          <button type="button" data-level-url="/levels/level_007_iron_labyrinth.json">07 · Iron Labyrinth</button>
        </div>
        <div id="status" class="hud__status">Initializing Havok…</div>
        <div id="projectile-selector" class="projectiles" aria-label="Projectile selection"></div>
        <div id="power-wrap" class="power" aria-hidden="true"><div id="power-bar" class="power__bar"></div></div>
        <div class="hud__actions">
          <button id="reset-button" type="button">↻ Reset</button>
          <button id="debug-button" type="button">F3 Debug</button>
        </div>
        <div class="hud__help">Scout: WASD · Q/E height · Shift boost · RMB orbit · wheel zoom · Throw: hold LMB/touch, pull for power, release · 1/2/3 projectile · R reset · F3 debug</div>
        <aside id="debug-panel" class="debug-panel" hidden></aside>
        <section id="result-panel" class="result" hidden aria-live="polite">
          <div class="result__card">
            <small id="result-title">LEVEL COMPLETE</small>
            <div id="result-stars" class="result__stars">☆ ☆ ☆</div>
            <strong id="result-score">0 POINTS</strong>
            <div class="result__actions">
              <button id="result-retry" type="button">Retry</button>
              <button id="result-next" type="button">Next level →</button>
            </div>
          </div>
        </section>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

name: Generate HD PBR textures

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/generate_texture_kit.py"
      - ".github/workflows/generate-textures.yml"

permissions:
  contents: write

concurrency:
  group: happyblocks-texture-generation
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install texture tooling
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Generate deterministic PBR pack
        run: python tools/generate_texture_kit.py

      - name: Validate generated pack
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          root = Path("public/assets/textures/pbr")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          if manifest.get("version") != 2:
              raise SystemExit(f"expected texture manifest v2, got {manifest.get('version')}")

          expected = {
              "hd": {"baseColor": (2048, 2048), "normal": (1024, 1024), "orm": (1024, 1024), "emissive": (1024, 1024)},
              "mobile": {"baseColor": (1024, 1024), "normal": (512, 512), "orm": (512, 512), "emissive": (512, 512)},
          }
          count = 0
          for profile_name, profile in manifest["profiles"].items():
              if profile_name not in expected:
                  raise SystemExit(f"unexpected profile {profile_name}")
              for material, maps in profile["materials"].items():
                  for channel, filename in maps.items():
                      path = root / filename
                      if not path.is_file():
                          raise SystemExit(f"missing {profile_name}.{material}.{channel}: {path}")
                      with Image.open(path) as image:
                          if image.size != expected[profile_name][channel]:
                              raise SystemExit(f"wrong size for {filename}: {image.size} != {expected[profile_name][channel]}")
                          if image.format != "WEBP":
                              raise SystemExit(f"wrong format for {filename}: {image.format}")
                      count += 1
          if count != 38:
              raise SystemExit(f"expected 38 WebP maps across profiles, got {count}")
          print(f"validated {count} standalone WebP PBR maps across HD + mobile")
          PY

      - name: Commit generated texture pack
        run: |
          if git diff --quiet -- public/assets/textures/pbr; then
            echo "Texture pack already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/textures/pbr
          git commit -m "assets: regenerate standalone HD and mobile PBR texture pack"
          git push origin HEAD:main
